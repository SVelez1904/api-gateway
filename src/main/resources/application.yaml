server:
  port: 8080 # Puerto interno del contenedor (mapeado afuera como 8085)

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      # --- FILTRO GLOBAL DE DEDUPLICACIÓN ---
      # Esto limpia los headers duplicados de TODOS los controladores de fondo automáticamente
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

      # --- CONFIGURACIÓN GLOBAL DE CORS ---
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      # --- ENRUTAMIENTO DE MICROSERVICIOS ---
      routes:
        # 1. Ruta para el Swagger de Usuarios
        - id: swagger-usuarios
          uri: http://api-usuarios:8080
          predicates:
            - Path=/v3/api-docs/**, /swagger-ui/**, /swagger-ui.html

        # 2. Ruta para Proyectos
        - id: gestion-proyectos
          uri: http://api-proyectos:8081
          predicates:
            - Path=/api/proyectos/**
          filters:
            - StripPrefix=1

        # 3. Ruta para Usuarios y Auth (Login corre aquí)
        - id: gestion-usuarios
          uri: http://api-usuarios:8080
          predicates:
            - Path=/api/usuarios/**
          filters:
            - StripPrefix=1

        # 4. Ruta para Analytics
        - id: api-analytics
          uri: http://api-analytics:8080
          predicates:
            - Path=/api/analytics/**


management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway