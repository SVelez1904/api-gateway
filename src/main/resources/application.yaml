server:
  port: 8080

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        # 1. Ruta para el Swagger de Usuarios
        - id: swagger-usuarios
          uri: http://api-usuarios:8080
          predicates:
            - Path=/v3/api-docs/**, /swagger-ui/**, /swagger-ui.html

        # 2. Ruta para Proyectos
        - id: gestion-proyectos
          uri: http://api-proyectos:8081
          predicates:
            - Path=/api/proyectos/**

        # 3. Ruta para Usuarios y Auth
        - id: gestion-usuarios
          uri: http://api-usuarios:8080
          predicates:
            - Path=/api/usuarios/**
          filters:
            - StripPrefix=1
            - PreserveHostHeader

        # 4. RUTA: Analytics
        - id: api-analytics
          uri: http://api-analytics:8080  # Asegúrate de que este sea el host/puerto real
          predicates:
            - Path=/api/analytics/**
          filters:
            - StripPrefix=0 # Cámbialo a 1 si el microservicio no espera "/api" en su controller

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway