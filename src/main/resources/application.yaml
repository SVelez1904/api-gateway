server:
  port: 8080

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        # 1. Ruta para el Swagger de Usuarios (CORREGIDA)
        - id: swagger-usuarios
          uri: http://api-usuarios:8080
          predicates:
            - Path=/v3/api-docs/**, /swagger-ui/**, /swagger-ui.html

        # 2. Ruta para Proyectos
        - id: gestion-proyectos
          uri: http://api-proyectos:8080
          predicates:
            - Path=/api/proyectos/**

        # 3. Ruta para Usuarios y Auth
        - id: gestion-usuarios
          uri: http://api-usuarios:8080
          predicates:
            - Path=/api/usuarios/**
          filters:
            - StripPrefix=1
            - PreserveHostHeader

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway